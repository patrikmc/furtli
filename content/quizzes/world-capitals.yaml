# A quiz definition. `slug` is the permanent identity for this quiz — the
# URL is /quizzes/<slug>, and renaming it later creates a brand-new quiz
# rather than renaming this one, so treat it as immutable once real users
# have taken the quiz. See docs/QUIZZES.md for the full format reference
# and the seed/export workflow.
slug: world-capitals
title: World Capitals
description: >-
  Match each country to its capital city. Ten questions covering
  every continent — some easy, a few that trip people up.
category: Geography
thumbnailUrl: https://images.unsplash.com/photo-1524661135-423995f22d0b?w=400
coverImageUrl: https://images.unsplash.com/photo-1524661135-423995f22d0b?w=1600

questions:
  - key: france
    prompt: What is the capital of France?
    choices:
      - text: Lyon
      - text: Paris
        correct: true
      - text: Marseille
      - text: Nice

  - key: japan
    prompt: What is the capital of Japan?
    choices:
      - text: Osaka
      - text: Kyoto
      - text: Tokyo
        correct: true
      - text: Nagoya

  - key: australia
    prompt: What is the capital of Australia?
    choices:
      - text: Sydney
      - text: Melbourne
      - text: Canberra
        correct: true
      - text: Perth

  - key: brazil
    prompt: What is the capital of Brazil?
    choices:
      - text: Rio de Janeiro
      - text: São Paulo
      - text: Brasília
        correct: true
      - text: Salvador

  - key: canada
    prompt: What is the capital of Canada?
    choices:
      - text: Toronto
      - text: Vancouver
      - text: Montreal
      - text: Ottawa
        correct: true

  - key: egypt
    prompt: What is the capital of Egypt?
    choices:
      - text: Cairo
        correct: true
      - text: Alexandria
      - text: Giza
      - text: Luxor

  - key: turkey
    prompt: What is the capital of Turkey?
    choices:
      - text: Istanbul
      - text: Ankara
        correct: true
      - text: Izmir
      - text: Antalya

  - key: south-africa
    prompt: What is the capital of South Africa?
    choices:
      - text: Johannesburg
      - text: Cape Town
      - text: Pretoria
        correct: true
      - text: Durban
    # South Africa has three capitals in practice (executive, judicial,
    # legislative). Pretoria is the administrative/executive capital,
    # which is the conventional single answer — worth a comment here in
    # case a future admin "corrects" this thinking it's a mistake.

  - key: switzerland
    prompt: What is the capital of Switzerland?
    choices:
      - text: Zurich
      - text: Geneva
      - text: Bern
        correct: true
      - text: Basel

  - key: new-zealand
    prompt: What is the capital of New Zealand?
    choices:
      - text: Auckland
      - text: Wellington
        correct: true
      - text: Christchurch
      - text: Hamilton

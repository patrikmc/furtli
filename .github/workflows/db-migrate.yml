name: DB migrate (Neon)

on:
  push:
    branches: [master]
    paths:
      - "packages/db/migrations/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub environment holding the DB secret"
        type: choice
        options: [test]
        default: test

concurrency:
  group: db-migrate-${{ inputs.environment || 'test' }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'test' }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: fail fast if the secret is missing
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::DATABASE_URL_UNPOOLED is not set on the environment"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: apply migrations
        run: pnpm db:migrate

name: Deploy

# One pipeline, two targets:
#   push to master  -> staging     (Vercel custom environment "staging", furtli-web.vercel.app)
#   push to release -> production  (Vercel production, furtli.ch)
#
# Stages: CI (full test suite) -> DB migrations on that environment's Neon
# database (separate projects for staging and production) -> Vercel build + deploy from this runner -> smoke test.
# A failure at any stage stops the rest, so a red build or a failed migration
# never reaches the site.
#
# Vercel's own git integration is switched off for master and release
# (apps/web/vercel.json -> git.deploymentEnabled), otherwise Vercel would
# deploy in parallel without waiting for tests or migrations. PR previews
# still come from the git integration.
#
# Promote to production: `pnpm release` (fast-forwards release to master).
# See docs/DEPLOYMENT.md for the one-time setup (secrets, environments, DNS).

on:
  push:
    branches: [master, release]
  workflow_dispatch: # re-deploy the head of the selected branch

concurrency:
  # One deploy per branch at a time; never cancel one halfway.
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - id: pick
        run: |
          case "$GITHUB_REF_NAME" in
            release) echo "environment=production" >> "$GITHUB_OUTPUT" ;;
            master)  echo "environment=staging"    >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Deploys run only from master (staging) or release (production), not '$GITHUB_REF_NAME'"; exit 1 ;;
          esac

  ci:
    needs: target
    uses: ./.github/workflows/ci.yml

  migrate:
    needs: [target, ci]
    uses: ./.github/workflows/db-migrate.yml
    with:
      environment: ${{ needs.target.outputs.environment }}
    secrets: inherit

  deploy:
    needs: [target, migrate]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.target.outputs.environment }}
      url: ${{ vars.SITE_URL }}
    env:
      TARGET: ${{ needs.target.outputs.environment }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: check secrets
        run: |
          missing=0
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::secret $v is not set"; missing=1; fi
          done
          exit $missing

      - name: install Vercel CLI
        run: npm install --global vercel@latest

      - name: pull Vercel settings + env vars (${{ env.TARGET }})
        run: vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"

      - name: build (${{ env.TARGET }})
        run: vercel build --target="$TARGET" --token="$VERCEL_TOKEN"

      - name: deploy (${{ env.TARGET }})
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --target="$TARGET" --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url" >> "$GITHUB_STEP_SUMMARY"

      - name: smoke test
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          SITE_URL: ${{ vars.SITE_URL }}
          # "true" while the site is for the close circle only. Set the
          # environment variable EXPECT_PROTECTED=false when going public.
          EXPECT_PROTECTED: ${{ vars.EXPECT_PROTECTED || 'true' }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: bash scripts/smoke-test.sh

name: CI

# Runs on every PR and on pushes to main: lint, unit/component tests,
# typecheck, production build, and the Playwright E2E suite for the map.
# Vercel's git integration handles preview/production deploys separately.
#
# The E2E tests stub the swisstopo base-map style (apps/web/e2e/fixtures.ts),
# so they need no secrets and don't depend on swisstopo's uptime.
#
# The Postgres service runs the ingest integration tests: the whole pipeline
# (validate, match stations, load, diff, idempotency) against a real database,
# with recorded Open Data Zürich responses instead of the network.

on:
  pull_request:
  push:
    branches: [master]

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/app

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm -r lint

      - name: unit + component tests
        run: pnpm -r --if-present test

      - name: integration tests (ingest pipeline against real Postgres)
        run: |
          pnpm --filter db db:test:setup
          pnpm test:integration

      - name: typecheck
        run: pnpm -r typecheck

      - name: build
        run: pnpm --filter web build

  e2e:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: e2e (mobile + desktop)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

name: CI

# Lint, unit/component tests, ingest integration tests, typecheck, production
# build, the Playwright E2E suite, and (on master/release only) the database
# migration for that environment.
#
# Runs on every PR and on every push to master and release. Required Vercel
# Deployment Checks (Vercel builds on push, but only puts the new build live
# once these have passed; renaming a job means updating the checks in Vercel):
#   staging project:    ci, e2e, migrate (staging)
#   production project: ci, e2e, migrate (production)
#
#   push master  -> migrate the staging database     (GitHub environment "staging")
#   push release -> migrate furtli-production         (GitHub environment "production")
#   pull request -> `migrate` is skipped
#
# The E2E tests stub the swisstopo base-map style (apps/web/e2e/fixtures.ts),
# so they need no secrets and don't depend on swisstopo's uptime.
#
# The Postgres service runs the ingest integration tests: the whole pipeline
# (validate, match stations, load, diff, idempotency) against a real database,
# with recorded Open Data Zürich responses instead of the network.

on:
  pull_request:
  push:
    branches: [master, release]

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/app

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm -r lint

      - name: unit + component tests
        run: pnpm -r --if-present test

      - name: integration tests (ingest pipeline against real Postgres)
        run: |
          pnpm --filter db db:test:setup
          pnpm test:integration

      - name: typecheck
        run: pnpm -r typecheck

      - name: build
        run: pnpm --filter web build

  e2e:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: e2e (mobile + desktop)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  migrate:
    # Named per environment, so the check names differ: "migrate (staging)" /
    # "migrate (production)". A release commit is the same commit master already
    # ran CI on; with a plain "migrate" name, the green staging migration would
    # satisfy the production project's Deployment Check before production's
    # database was migrated.
    name: migrate (${{ github.ref_name == 'release' && 'production' || 'staging' }})
    # Only after the tests passed, and only for the two deploy branches.
    needs: [ci, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The environment holds DATABASE_URL_UNPOOLED (direct connection string)
    # and only lets master (staging) / release (production) use it.
    environment: ${{ github.ref_name == 'release' && 'production' || 'staging' }}
    concurrency:
      group: migrate-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - name: fail fast if the secret is missing
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::DATABASE_URL_UNPOOLED is not set on this GitHub environment"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: apply migrations
        run: pnpm db:migrate

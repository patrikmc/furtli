name: CI

# Runs on every PR: lint, unit/component/integration tests, typecheck, and
# a full production build. This is the fast, no-external-services gate —
# Vercel's own git integration (see root README) handles actual
# preview/production deploys separately, so this workflow's only job is
# "would this even build, and do the tests that don't need Clerk pass."
#
# A real Postgres service container is used throughout (Next.js's build
# touches `packages/db`'s client, drizzle-kit's config requires a
# DATABASE_URL to be set even for a typecheck, and the integration tests
# run real queries against it). It also doubles as a real regression test
# for the quiz content pipeline: `pnpm db:seed` runs content/quizzes/*.yaml
# through the same Zod validation and upsert path production uses, so a
# broken YAML file or a schema/pipeline mismatch fails the PR instead of
# surfacing later against a real database.
#
# E2E (Playwright + @clerk/testing) deliberately does NOT run here — it
# needs a Clerk *test* instance's secrets, which aren't configured as
# repo/org secrets yet. See docs/TESTING.md. Run it locally with
# `pnpm --filter web test:e2e` once you've filled in the E2E_* vars.

on:
  pull_request:
  push:
    branches: [master]

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/app

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm -r lint

      - name: apply schema to the throwaway CI database
        run: pnpm --filter db exec drizzle-kit push --force

      - name: seed sample quiz content (validates content/quizzes/*.yaml)
        run: pnpm db:seed

      - name: unit + component tests (db + web)
        run: pnpm -r --if-present test

      - name: create throwaway integration test database
        run: pnpm --filter db db:test:setup

      - name: integration tests (db, against real Postgres)
        run: pnpm --filter db test:integration

      - name: typecheck
        run: pnpm -r typecheck

      - name: build
        run: pnpm --filter web build


  e2e:
      if: vars.E2E_ENABLED == 'true'
      needs: ci
      runs-on: ubuntu-latest
      services:
        postgres:
          image: postgres:17-alpine
          env:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: app
          ports:
            - 5432:5432
          options: >-
            --health-cmd "pg_isready -U postgres"
            --health-interval 5s
            --health-timeout 5s
            --health-retries 10
      env:
        CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
        NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL: /quizzes
        NEXT_PUBLIC_CLERK_SIGN_UP_FORCE_REDIRECT_URL: /quizzes
      steps:
        - uses: actions/checkout@v4
        - uses: pnpm/action-setup@v4
          
        - uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: pnpm
        - run: pnpm install --frozen-lockfile
        - name: schema + seed
          run: |
            pnpm --filter db exec drizzle-kit push --force
            pnpm db:seed
        - name: install Playwright browser
          run: pnpm --filter web exec playwright install --with-deps chromium
        - name: e2e
          run: pnpm test:e2e
        - uses: actions/upload-artifact@v4
          if: failure()
          with:
            name: playwright-traces
            path: apps/web/test-results
            retention-days: 7